[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pickel-agent"
version = "0.1.0"
description = "本地优先、高度可扩展的 AI 编码与工作空间自动化 Agent 运行期系统。 | A local-first, highly extensible AI Agent runtime for coding and workspace automation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.96.0",
    "google-genai>=1.68.0",
    "pydantic>=2.12.5",
    "prompt-toolkit>=3.0.0",
    "rich>=14.1.0",
    "pyyaml>=6.0.3",
    "typer>=0.24.1",
    "mcp[cli]>=2.0.0,<3",
    "openviking>=0.3.5",
    "httpx[socks]>=0.28.1",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    "black>=24.10.0",
    "coverage>=7.6.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.0,<0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pickel"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[project.scripts]
pickel = "pickel.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pickel.agents" = ["builtin/*/AGENT.md", "builtin/*/agent.yaml"]
