name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Check formatting
        run: uv run black --check src tests

      - name: Run lint
        run: uv run ruff check src tests

      - name: Run tests
        run: uv run pytest -q --cov=pickel --cov-report=term-missing --cov-fail-under=75

  macos-runtime-boundaries:
    # 验证 macOS 专属 Seatbelt 执行边界和轻量 CLI 启动边界；不需要 secrets。
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Check macOS runtime boundaries
        run: >-
          uv run pytest -q
          tests/cli/test_import_boundaries.py
          tests/tools/test_sandbox.py
          tests/tools/test_sandbox_shell.py
          tests/app/test_sandbox_wiring.py
